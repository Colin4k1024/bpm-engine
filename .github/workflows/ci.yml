# Same checks can be run locally before pushing: ./scripts/ci.sh
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Run invariant tests
        run: cargo test --test invariant_token --test invariant_join --test invariant_external_task

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bpm
          POSTGRES_PASSWORD: bpm
          POSTGRES_DB: bpm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bpm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Maintenance DB of the service container; the tests create an isolated
      # database per test from this URL (no Docker-in-Docker needed).
      BPM_TEST_DATABASE_URL: postgres://bpm:bpm@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run migration tests
        run: cargo test -p bpm-engine-adapter-postgres --test migrations -- --ignored

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run coverage
        run: cargo tarpaulin --workspace --out xml --output-dir coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
