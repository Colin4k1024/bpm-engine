[package]
name = "bpm-engine-mcp-server"
version = "0.2.0"
edition = "2021"
description = "Model Context Protocol (MCP) server exposing the BPM engine REST API as agent tools (stdio JSON-RPC)"
license = "MIT"
# Workspace-internal tool, never published: the agent tool catalog is
# embedded from ../server/rest/capabilities/agent-tools.json via a
# workspace-relative include_str! (single source, no copy), and a path
# escaping the crate directory cannot be packaged by `cargo package`.
# Standalone packaging would need a build-time copy of the catalog —
# deliberately out of scope (see docs/mcp-server.md).
publish = false

[lib]
name = "bpm_engine_mcp_server"
path = "src/lib.rs"

[[bin]]
name = "bpm-engine-mcp-server"
path = "src/main.rs"

[dependencies]
# Runtime surface (issue #20): the MCP server is a loopback REST client plus
# a JSON-RPC transport. The engine is reached over HTTP only;
# bpm-engine-server-rest is a DEV-dependency (in-process test server), never
# a runtime dependency. N5-1 adds the HTTP+SSE transport (axum): the MCP
# server is a workspace-internal tool (publish = false), so axum is a plain
# dependency rather than a feature-gated surface — stdio remains the default
# transport (BPM_MCP_TRANSPORT=stdio).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
# HTTP+SSE transport (N5-1): axum serves the SSE + POST endpoints;
# tokio-stream provides the ReceiverStream and stream combinators used to
# bridge POSTed JSON-RPC responses onto each client's SSE stream.
axum = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
# In-process engine for the end-to-end suite: build_app (memory mode) served
# on an ephemeral loopback port, driven through the real MCP handler. The
# subprocess suite additionally spawns the real binary, so tokio needs the
# `process` feature here. The HTTP transport test drives the real axum router
# over an ephemeral listener with a reqwest streaming client (reqwest's
# `stream` feature rides on the main dependency so the test reuses it).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
bpm-engine-server-rest = { path = "../server/rest", version = "0.2.0" }
