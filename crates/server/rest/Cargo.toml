[package]
name = "bpm-engine-server-rest"
version = "0.2.0"
edition = "2021"
description = "REST API server for the BPM engine (Axum)"
license = "MIT"

[[bin]]
name = "api_server"
path = "src/main.rs"

[dependencies]
bpm-engine-core = { path = "../../core", version = "0.2.0" }
bpm-engine-runtime = { path = "../../runtime", version = "0.2.0" }
bpm-engine-storage = { path = "../../storage", version = "0.2.0" }
bpm-engine-adapter-memory = { path = "../../adapters/memory", version = "0.2.0" }
bpm-engine-bpmn = { path = "../../bpmn", version = "0.2.0" }
anyhow = { workspace = true }
axum = "0.7"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = "9"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
config = "0.14"
toml = "0.8"

# OpenTelemetry (optional — enable via "otel" feature)
opentelemetry = { version = "0.29", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.29", default-features = false, features = ["trace", "rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.29", default-features = false, features = ["trace", "grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.30", optional = true }
tower-http = { version = "0.6", default-features = false, features = ["trace"], optional = true }

# Prometheus metrics (optional — enable via "observability" feature)
bpm-engine = { path = "../../..", optional = true }
metrics = { version = "0.23", optional = true }
metrics-exporter-prometheus = { version = "0.15", optional = true }

[features]
default = []
otel = [
    "opentelemetry",
    "opentelemetry_sdk",
    "opentelemetry-otlp",
    "tracing-opentelemetry",
    "tower-http",
]
observability = ["bpm-engine/observability", "metrics", "metrics-exporter-prometheus"]
