      properties:
        token_id:
          type: string
        node_id:
          type: string
        state:
          type: string
          description: Token status name.

    ReplaySnapshotView:
      type: object
      required: [completed, tokens]
      properties:
        completed:
          type: boolean
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/ReplayTokenView"

    ReplayStepResponse:
      type: object
      required: [cursor, event, snapshot]
      properties:
        cursor:
          type: integer
        event:
          $ref: "#/components/schemas/ReplayEventView"
        snapshot:
          $ref: "#/components/schemas/ReplaySnapshotView"

    ReplaySeekRequest:
      type: object
      required: [cursor]
      properties:
        cursor:
          type: integer
          description: Zero-based event index to seek to (clamped to the
            session's event count).

    ReplaySeekResponse:
      type: object
      required: [cursor, snapshot]
      properties:
        cursor:
          type: integer
        snapshot:
          $ref: "#/components/schemas/ReplaySnapshotView"

    ReplaySnapshotResponse:
      type: object
      required: [cursor, total_events, completed, tokens]
      properties:
        cursor:
          type: integer
        total_events:
          type: integer
        completed:
          type: boolean
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/ReplayTokenView"

    DeployResponse:
      type: object
      required: [process_definition_id]
      properties:
        process_definition_id:
          type: string

    DeployErrorParse:
      description: "BPMN XML parse failure body: a single message object."
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: BPMN XML parse error message.

    DeployError:
      description: |
        Failure body of `POST /api/v1/process-definitions/deploy` (serde
        untagged enum): a parse failure carries `error`; semantic compile
        failures carry `errors`. Exactly one of the two fields is present
        per 400 response. The 500 persistence failure does NOT use this
        shape — it uses the standard ErrorResponse with code
        `deploy_failed`.
      type: object
      properties:
        error:
          type: string
          description: BPMN XML parse error message.
        errors:
          type: array
          description: Semantic compile errors.
          items:
            $ref: "#/components/schemas/CompilerError"

    CompilerError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - NoStartEvent
            - MultipleStartEvents
            - NoEndEvent
            - OrphanNode
            - DeadEnd
            - ExclusiveGatewayNoDefault
            - ParallelGatewayInvalidShape
            - SequenceFlowSourceNotFound
            - SequenceFlowTargetNotFound
            - UnsupportedElement
        message:
          type: string
        node_id:
          type: ["string", "null"]
          description: Affected node (null when the error is definition-wide).
        flow_id:
          type: ["string", "null"]
          description: Affected sequence flow (null when not flow-specific).
        hint:
          type: ["string", "null"]
          description: Optional remediation hint (null when absent).

    ValidateSourceRequest:
      type: object
      required: [format, source]
      properties:
        format:
          type: string
          enum: [bpmn, dsl]
        source:
          type: string
          description: Full source document (XML or JSON, per `format`).
        variables:
          type: object
          additionalProperties: { type: string }
          default: {}
          description: Hypothetical start variables (dry-run only).

    CompileErrorsView:
      description: |
        Compile-phase failures as DATA (HTTP 200). Genuinely polymorphic
        (serde untagged enum — cannot be a single typed object):
        - a BPMN parse failure serializes as `{"error": "..."}` — exactly
          the `DeployErrorParse` object schema;
        - BPMN semantic errors serialize as an ARRAY of
          `CompilerError` objects;
        - DSL errors serialize as an ARRAY of `DslError` objects.
        The concrete element schemas are referenced below from the
        sample-validation tests of the consistency suite.

    DslError:
      description: |
        One DSL compile diagnostic (serde camelCase fields): a stable
        snake_case `code`, a JSON-pointer `path`, a `message`, an optional
        actionable `hint` (null when absent), and `sourceCode` — the
        upstream BPMN `ErrorCode` name, present only when `code` is
        `compile`.
      type: object
      required: [code, path, message]
      properties:
        code:
          type: string
          description: Stable snake_case code (docs/dsl-guide.md).
        path:
          type: string
          description: JSON-pointer path into the source document.
        message:
          type: string
        hint:
          type: ["string", "null"]
          description: Optional actionable hint (null when absent).
        sourceCode:
          type: string
          description: 'Upstream BPMN ErrorCode name (only for code "compile").'

    ValidationFinding:
      type: object
      required: [severity, code, message]
      properties:
        severity:
          type: string
          enum: [Critical, Warning, Info]
        code:
          type: string
          description: Stable snake_case finding code (E2-2).
        node_id:
          type: string
        message:
          type: string

    ValidateResponse:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
          description: False when compilation failed or a Critical finding exists.
        compile_errors:
          $ref: "#/components/schemas/CompileErrorsView"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ValidationFinding"

    DryRunStep:
      type: object
      required: [node_id, node_type]
      properties:
        node_id:
          type: string
        node_type:
          type: string
          description: Stable camelCase node-type name.
        detail:
          type: string

    DryRunTerminus:
      description: |
        How the dry-run walk ended. Serialized by serde as an INTERNALLY
        TAGGED object (`tag = "type"`, camelCase variant names): every
        terminus is `{"type": <tag>, "node_id": ...}` and the two
        "paused/cannot continue" variants additionally carry `reason`.
        `node_id` is snake_case on the wire (serde field name, unchanged
        by the variant rename).
      type: object
      required: [type, node_id]
      properties:
        type:
          type: string
          enum:
            - completedAt
            - waitingAt
            - stuckAt
            - unresolvedBranch
            - maxStepsExceeded
          description: |
            The terminus kind: `completedAt` — an end event was reached;
            `waitingAt` — execution would pause at this node (user task,
            timer/message/signal catch, or a parallel join waiting for
            remaining branches); `stuckAt` — the walk cannot continue
            (e.g. every gateway condition false, no default edge);
            `unresolvedBranch` — gateway routing undecidable by the
            lightweight evaluator; `maxStepsExceeded` — the step budget
            ran out (typical for loops).
        node_id:
          type: string
          description: The node the terminus refers to (end node, wait node,
            stuck gateway, or the node about to be visited at budget
            exhaustion).
        reason:
          type: string
          description: Why the walk waits (`waitingAt`) or cannot continue
            (`stuckAt`) — present on those two variants only.

    DryRunReport:
      type: object
      required: [steps, terminus, unresolved_conditions, max_steps]
      properties:
        steps:
          type: array
          items:
            $ref: "#/components/schemas/DryRunStep"
        terminus:
          $ref: "#/components/schemas/DryRunTerminus"
        unresolved_conditions:
          type: array
          items: { type: string }
        max_steps:
          type: integer

    DryRunResponse:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        compile_errors:
          $ref: "#/components/schemas/CompileErrorsView"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ValidationFinding"
        dry_run:
          $ref: "#/components/schemas/DryRunReport"

    DefinitionVersionView:
      type: object
      required: [id, key, version, status, created_at]
      properties:
        id:
          type: string
        key:
          type: string
        version:
          type: integer
        status:
          type: string
