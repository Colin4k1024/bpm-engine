    DeadLetterEntry:
      type: object
      required:
        - id
        - task_id
        - token_id
        - process_instance_id
        - task_type
        - error_message
        - variables
        - created_at
      properties:
        id:
          type: string
        task_id:
          type: string
        token_id:
          type: string
        process_instance_id:
          type: string
        task_type:
          type: string
        error_message:
          type: string
        variables:
          type: string
          description: Process variables as serialized JSON.
        tenant_id:
          type: string
        created_at:
          type: string

    DeadLetterListResponse:
      type: object
