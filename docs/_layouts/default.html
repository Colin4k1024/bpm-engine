<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #24292e;
      background: #ffffff;
    }

    /* Navigation */
    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #e1e4e8;
      padding: 0 24px;
    }

    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 700;
      color: #24292e;
      text-decoration: none;
    }

    .nav-brand svg {
      width: 24px;
      height: 24px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      color: #586069;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #24292e;
    }

    .nav-github {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #24292e;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .nav-github:hover {
      background: #404448;
    }

    /* Main Content */
    .main {
      min-height: calc(100vh - 60px - 200px);
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 40px 20px;
      border-top: 1px solid #e1e4e8;
      background: #f6f8fa;
    }

    .footer p {
      color: #586069;
      font-size: 14px;
    }

    .footer a {
      color: #0366d6;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 16px;
    }

    .footer-license {
      margin-top: 8px;
      color: #8c959f;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 100px 20px 80px;
      background: linear-gradient(180deg, #f6f8fa 0%, #ffffff 100%);
      border-bottom: 1px solid #e1e4e8;
    }

    .hero-badge {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .badge {
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 20px;
      background: #e1e4e8;
      color: #0366d6;
    }

    .hero-title {
      font-size: 56px;
      font-weight: 700;
      color: #24292e;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    .hero-subtitle {
      font-size: 22px;
      color: #586069;
      max-width: 700px;
      margin: 0 auto 36px;
      line-height: 1.5;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #2ea44f;
      color: #ffffff;
      border: 1px solid #2ea44f;
    }

    .btn-primary:hover {
      background: #2c974b;
    }

    .btn-secondary {
      background: #ffffff;
      color: #24292e;
      border: 1px solid #e1e4e8;
    }

    .btn-secondary:hover {
      background: #f6f8fa;
      border-color: #e1e4e8;
    }

    /* Section */
    .section {
      padding: 80px 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 32px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 16px;
      color: #24292e;
    }

    .section-desc {
      text-align: center;
      color: #586069;
      max-width: 700px;
      margin: 0 auto 48px;
      font-size: 18px;
    }

    /* Features Grid */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }

    .feature-card {
      padding: 28px;
      background: #ffffff;
      border: 1px solid #e1e4e8;
      border-radius: 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .feature-card:hover {
      border-color: #0366d6;
      box-shadow: 0 4px 12px rgba(3, 102, 214, 0.1);
    }

    .feature-icon {
      font-size: 36px;
      margin-bottom: 16px;
    }

    .feature-card h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #24292e;
    }

    .feature-card p {
      color: #586069;
      font-size: 15px;
      line-height: 1.6;
    }

    /* Code Tabs */
    .code-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 0;
      border-bottom: 1px solid #e1e4e8;
      background: #f6f8fa;
      border-radius: 8px 8px 0 0;
      padding: 8px 8px 0;
    }

    .tab-btn {
      padding: 10px 20px;
      background: none;
      border: none;
      font-size: 14px;
      font-weight: 500;
      color: #586069;
      cursor: pointer;
      border-radius: 6px 6px 0 0;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: #24292e;
      background: rgba(0, 0, 0, 0.05);
    }

    .tab-btn.active {
      color: #0366d6;
      background: #ffffff;
    }

    .tab-content {
      display: none;
      background: #1f2328;
      border-radius: 0 0 8px 8px;
      padding: 24px;
      overflow-x: auto;
    }

    .tab-content.active {
      display: block;
    }

    .code-note {
      margin-top: 16px;
      font-size: 14px;
      color: #586069;
    }

    .code-note code {
      background: #f6f8fa;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 13px;
    }

    /* Code Block Styling */
    .highlight {
      background: #1f2328;
      border-radius: 8px;
      overflow-x: auto;
    }

    .highlight pre {
      margin: 0;
      padding: 20px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 14px;
      line-height: 1.6;
      color: #e6edf3;
    }

    .highlight .nt { color: #7ee787; }  /* Tag names */
    .highlight .na { color: #79c0ff; }  /* Attribute names */
    .highlight .s { color: #a5d6ff; }   /* Strings */
    .highlight .nb { color: #79c0ff; }  /* Built-ins */
    .highlight .nf { color: #d2a8ff; }  /* Functions */
    .highlight .c { color: #8c959f; }   /* Comments */
    .highlight .k { color: #ff7b72; }   /* Keywords */

    /* Architecture */
    .arch-diagram {
      background: #f6f8fa;
      padding: 32px;
      border-radius: 12px;
      margin: 32px 0;
      overflow-x: auto;
    }

    .arch-diagram pre {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 13px;
      line-height: 1.5;
      color: #24292e;
    }

    .arch-links {
      display: flex;
      justify-content: center;
      gap: 32px;
      flex-wrap: wrap;
      margin-top: 32px;
    }

    .arch-links a {
      color: #0366d6;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
    }

    .arch-links a:hover {
      text-decoration: underline;
    }

    /* Tables */
    .crates-table,
    .api-table {
      overflow-x: auto;
      border: 1px solid #e1e4e8;
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      background: #ffffff;
    }

    th {
      background: #f6f8fa;
      font-weight: 600;
      text-align: left;
      padding: 14px 16px;
      border-bottom: 1px solid #e1e4e8;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid #e1e4e8;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover {
      background: #f6f8fa;
    }

    code {
      padding: 2px 6px;
      background: #f6f8fa;
      border-radius: 4px;
      font-size: 13px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    .method {
      display: inline-block;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
    }

    .method.post {
      background: #dafbe1;
      color: #1a7f37;
    }

    .method.get {
      background: #dbeafe;
      color: #0366d6;
    }

    /* Docs Grid */
    .docs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
    }

    .doc-card {
      padding: 24px;
      background: #ffffff;
      border: 1px solid #e1e4e8;
      border-radius: 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .doc-card:hover {
      border-color: #0366d6;
      box-shadow: 0 4px 12px rgba(3, 102, 214, 0.1);
    }

    .doc-card h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #24292e;
    }

    .doc-card ul {
      list-style: none;
    }

    .doc-card li {
      margin-bottom: 10px;
    }

    .doc-card a {
      color: #0366d6;
      text-decoration: none;
      font-size: 14px;
    }

    .doc-card a:hover {
      text-decoration: underline;
    }

    /* Status Section */
    .status-section {
      background: #f6f8fa;
      border-radius: 16px;
      padding: 60px 40px;
      margin: 60px auto;
      max-width: 900px;
    }

    .status-grid {
      display: flex;
      justify-content: center;
      gap: 48px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .status-item {
      text-align: center;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    .status-stable {
      background: #dafbe1;
      color: #1a7f37;
    }

    .status-evolving {
      background: #fff8c5;
      color: #9a6700;
    }

    .status-research {
      background: #e1e4e8;
      color: #586069;
    }

    .status-item p {
      font-size: 14px;
      color: #586069;
    }

    .status-note {
      text-align: center;
      color: #586069;
      font-size: 15px;
    }

    .status-note strong {
      color: #24292e;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .nav-links {
        display: none;
      }

      .hero-title {
        font-size: 40px;
      }

      .hero-subtitle {
        font-size: 18px;
      }

      .features-grid {
        grid-template-columns: 1fr;
      }

      .docs-grid {
        grid-template-columns: 1fr;
      }

      .status-grid {
        flex-direction: column;
        align-items: center;
      }

      .section {
        padding: 60px 20px;
      }

      .status-section {
        padding: 40px 20px;
      }
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="{{ site.baseurl }}/" class="nav-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 6v6l4 2"/>
        </svg>
        bpm-engine
      </a>
      <ul class="nav-links">
        <li><a href="{{ site.baseurl }}/#getting-started">Quick Start</a></li>
        <li><a href="{{ site.baseurl }}/docs/architecture.html">Architecture</a></li>
        <li><a href="{{ site.baseurl }}/docs/api-spec.html">API</a></li>
        <li><a href="{{ site.baseurl }}/docs/invariants.html">Invariants</a></li>
      </ul>
      <a href="https://github.com/fanjia1024/bpm-engine" class="nav-github" target="_blank">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        GitHub
      </a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main">
    {{ content }}
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-links">
      <a href="https://github.com/fanjia1024/bpm-engine">GitHub</a>
      <a href="{{ site.baseurl }}/docs/architecture.html">Documentation</a>
      <a href="https://crates.io/crates/bpm-engine">Crates.io</a>
      <a href="{{ site.baseurl }}/CONTRIBUTING.html">Contributing</a>
    </div>
    <p><strong>bpm-engine</strong> — A correctness-first workflow execution kernel</p>
    <p class="footer-license">MIT License</p>
  </footer>

  <!-- Tab Switcher -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const tabBtns = document.querySelectorAll('.tab-btn');
      const tabContents = document.querySelectorAll('.tab-content');

      tabBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          const tabId = this.getAttribute('data-tab');

          tabBtns.forEach(function(b) { b.classList.remove('active'); });
          tabContents.forEach(function(c) { c.classList.remove('active'); });

          this.classList.add('active');
          document.getElementById(tabId).classList.add('active');
        });
      });
    });
  </script>
</body>
</html>
