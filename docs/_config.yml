title: bpm-engine
description: A correctness-first, token-driven workflow execution kernel in Rust
baseurl: /bpm-engine
url: https://colin4k1024.github.io
github:
  repository_url: https://github.com/fanjia1024/bpm-engine
  repository_name: fanjia1024/bpm-engine

# Jekyll settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Exclude from processing
exclude:
  - README.md
  - LICENSE.txt
  - CHANGELOG.md
  - CLAUDE.md
  - CLAUDE_zh.md

# Collections
collections:
  adr:
    output: true
    permalink: /adr/:name/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: "pages"
    values:
      lang: en

# Language settings
languages:
  en:
    name: English
    flag: 🇺🇸
  zh:
    name: 中文
    flag: 🇨🇳

# Navigation
navigation:
  en:
    - title: Features
      url: /#features
    - title: Quick Start
      url: /#getting-started
    - title: Docs
      url: /docs/architecture.html
    - title: API
      url: /#api
  zh:
    - title: 特性
      url: /index_zh.html#features
    - title: 快速开始
      url: /index_zh.html#getting-started
    - title: 文档
      url: /docs/architecture_zh.html
    - title: API
      url: /index_zh.html#api
